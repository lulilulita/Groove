<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Groove</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 220px; background: #1a1a1a; color: white; padding: 20px 0; flex-shrink: 0; }
        .admin-sidebar .logo-admin { padding: 0 20px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .admin-sidebar a { display: block; padding: 12px 20px; color: #cccccc; text-decoration: none; }
        .admin-sidebar a:hover, .admin-sidebar a.activo { background: #333; color: white; }
        .admin-contenido { flex: 1; padding: 30px; text-align: left; }
        @media (max-width: 700px) {
            .admin-layout { flex-direction: column; }
            .admin-sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="logo-admin">Groove Admin</div>
            <a href="admin-home.html" class="activo"> Inicio</a>
            <a href="admin-productos.html"> Productos</a>
            <a href="admin-usuarios.html">Usuarios</a>
            <a href="../index.html">← Volver a la tienda</a>
        </aside>

        <main class="admin-contenido">
            <h2>¡Hola Administrador!</h2>
            <p>Desde aquí puedes gestionar el catálogo de productos y los usuarios registrados en Groove.</p>

            <div style="display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;">
                <div style="background:#f5f5f5; padding:20px; border-radius:10px; min-width:200px;">
                    <h3>Productos</h3>
                    <p id="total-productos">Cargando...</p>
                    <a href="admin-productos.html">Gestionar →</a>
                </div>
                <div style="background:#f5f5f5; padding:20px; border-radius:10px; min-width:200px;">
                    <h3>Usuarios</h3>
                    <p id="total-usuarios">Cargando...</p>
                    <a href="admin-usuarios.html">Gestionar →</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/productos-data.js"></script>
    <script>
        document.getElementById("total-productos").textContent = productos.length + " productos en catálogo";

        const usuarios = JSON.parse(localStorage.getItem("usuarios_groove")) || [];
        document.getElementById("total-usuarios").textContent = usuarios.length + " usuarios registrados";
    </script>
</body>
</html>
